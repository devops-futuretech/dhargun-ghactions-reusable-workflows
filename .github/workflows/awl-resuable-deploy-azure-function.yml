# ==========================================================================================
# Workflow : AWL - Deploy Azure Function
# Purpose  : Reusable workflow for Azure Function deployment
# Runner   : Self-hosted Runner (deploy)
# Version  : v1.0
# ==========================================================================================

name: AWL - Deploy Azure Function

on:

  workflow_call:

    inputs:

      environment:
        required: true
        type: string

      resource-group:
        required: true
        type: string

      function-app-name:
        required: true
        type: string

      artifact-name:
        required: true
        type: string

      package-path:
        required: false
        default: artifact
        type: string

      deployment-method:
        required: false
        default: zip
        type: string

      startup-command:
        required: false
        default: ""
        type: string

      enable-health-check:
        required: false
        default: false
        type: boolean

      health-url:
        required: false
        default: ""
        type: string

    secrets:

      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:

  id-token: write
  contents: read

jobs:

  deploy:

    runs-on:

      - self-hosted
      - deploy

    environment:
      name: ${{ inputs.environment }}

    steps:

      # Checkout source
      - uses: actions/checkout@v5

      # Download artifact
      - uses: ./.github/actions/awl-download-artifact
        with:
          artifact-name: ${{ inputs.artifact-name }}
          download-path: ${{ inputs.package-path }}

      # Azure login
      - uses: ./.github/actions/awl-azure-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy Function App
      - uses: ./.github/actions/awl-deploy-azure-function
        with:
          resource-group: ${{ inputs.resource-group }}
          function-app-name: ${{ inputs.function-app-name }}
          package-path: ${{ inputs.package-path }}
          deployment-method: ${{ inputs.deployment-method }}
          startup-command: ${{ inputs.startup-command }}

      # Health Check
      - name: Health Check
        if: inputs.enable-health-check && inputs.health-url != ''
        uses: ./.github/actions/awl-health-check
        with:
          health-url: ${{ inputs.health-url }}