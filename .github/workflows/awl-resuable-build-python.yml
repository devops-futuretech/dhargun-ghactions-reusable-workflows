# ==========================================================================================
# Workflow : AWL - Build Python
# Purpose  : Reusable workflow to build Python applications
# Runner   : Self-hosted Runner (build)
# Author   : AWL DevOps Team
# Version  : v1.0
# ==========================================================================================

name: AWL - Build Python

on:

  workflow_call:

    inputs:

      working-directory:
        description: Python project directory
        required: false
        default: "."
        type: string

      python-version:
        description: Python Version
        required: false
        default: "3.12"
        type: string

      package-manager:
        description: pip or poetry
        required: false
        default: pip
        type: string

      requirements-file:
        description: Requirements file
        required: false
        default: requirements.txt
        type: string

      run-tests:
        description: Execute Unit Tests
        required: false
        default: false
        type: boolean

      test-command:
        description: Test command
        required: false
        default: pytest
        type: string

      build-command:
        description: Optional Build Command
        required: false
        default: ""
        type: string

      artifact-name:
        description: Artifact Name
        required: true
        type: string

      artifact-path:
        description: Artifact Path
        required: false
        default: "."
        type: string

      retention-days:
        description: Artifact Retention
        required: false
        default: 30
        type: number

permissions:

  contents: read

jobs:

  build:

    name: Build Python Application

    runs-on:

      - self-hosted
      - build

    defaults:

      run:

        shell: pwsh

        working-directory: ${{ inputs.working-directory }}

    outputs:

      artifact-name: ${{ inputs.artifact-name }}

      artifact-path: ${{ inputs.artifact-path }}

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Setup Python runtime
      - name: Setup Python
        uses: ./.github/actions/awl-setup-python
        with:
          python-version: ${{ inputs.python-version }}

      # Install dependencies
      - name: Install Dependencies
        run: |

          if("${{ inputs.package-manager }}" -eq "pip")
          {
              python -m pip install --upgrade pip
              pip install -r "${{ inputs.requirements-file }}"
          }
          else
          {
              pip install poetry
              poetry install
          }

      # Execute unit tests
      - name: Run Tests
        if: inputs.run-tests
        run: |

          if("${{ inputs.package-manager }}" -eq "pip")
          {
              ${{ inputs.test-command }}
          }
          else
          {
              poetry run ${{ inputs.test-command }}
          }

      # Execute optional build command
      - name: Build Package
        if: inputs.build-command != ''
        run: |
          ${{ inputs.build-command }}

      # Validate artifact path
      - name: Validate Artifact
        run: |

          if(!(Test-Path "${{ inputs.artifact-path }}"))
          {
              throw "Artifact path not found."
          }

      # Upload artifact
      - name: Upload Artifact
        uses: ./.github/actions/awl-upload-artifact
        with:

          artifact-name: ${{ inputs.artifact-name }}

          artifact-path: ${{ inputs.artifact-path }}

          retention-days: ${{ inputs.retention-days }}

      # Publish workflow summary
      - name: Build Summary
        shell: pwsh
        run: |

          @"

          ## Python Build Summary

          | Item | Value |
          |------|-------|
          | Runner | Build |
          | Python | ${{ inputs.python-version }} |
          | Package Manager | ${{ inputs.package-manager }} |
          | Requirements | ${{ inputs.requirements-file }} |
          | Tests | ${{ inputs.run-tests }} |
          | Artifact | ${{ inputs.artifact-name }} |
          | Repository | ${{ github.repository }} |
          | Branch | ${{ github.ref_name }} |
          | Commit | ${{ github.sha }} |

          "@ >> $env:GITHUB_STEP_SUMMARY