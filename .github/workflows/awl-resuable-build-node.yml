# ==========================================================================================
# Workflow : AWL - Build Node.js
# Purpose  : Reusable workflow to build Node.js backend applications
# Runner   : Self-hosted Runner (build)
# Author   : AWL DevOps Team
# Version  : v1.0
# ==========================================================================================

name: AWL - Build Node.js

on:

  workflow_call:

    inputs:

      working-directory:
        description: Node.js project directory
        required: false
        default: "."
        type: string

      node-version:
        description: Node.js Version
        required: false
        default: "22"
        type: string

      package-manager:
        description: npm | yarn | pnpm
        required: false
        default: npm
        type: string

      install-command:
        description: Dependency install command
        required: false
        default: ci
        type: string

      build-command:
        description: Build command (optional)
        required: false
        default: ""
        type: string

      run-tests:
        description: Execute unit tests
        required: false
        default: false
        type: boolean

      test-command:
        description: Test command
        required: false
        default: test
        type: string

      artifact-name:
        description: Artifact Name
        required: true
        type: string

      artifact-path:
        description: Artifact folder
        required: false
        default: "."
        type: string

      retention-days:
        description: Artifact retention
        required: false
        default: 30
        type: number

permissions:

  contents: read

jobs:

  build:

    name: Build Node.js Application

    runs-on:

      - self-hosted
      - build

    defaults:

      run:

        shell: pwsh

        working-directory: ${{ inputs.working-directory }}

    outputs:

      artifact-name: ${{ inputs.artifact-name }}

      artifact-path: ${{ inputs.artifact-path }}

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Setup Node runtime
      - name: Setup Node
        uses: ./.github/actions/awl-setup-node
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      # Install project dependencies
      - name: Install Dependencies
        run: |

          switch ("${{ inputs.package-manager }}")
          {

            "npm"
            {
              npm ${{ inputs.install-command }}
            }

            "yarn"
            {
              yarn install
            }

            "pnpm"
            {
              pnpm install
            }

            default
            {
              throw "Unsupported Package Manager"
            }

          }

      # Execute build command
      - name: Build Application
        if: inputs.build-command != ''
        run: |

          switch ("${{ inputs.package-manager }}")
          {

            "npm"
            {
              npm run ${{ inputs.build-command }}
            }

            "yarn"
            {
              yarn ${{ inputs.build-command }}
            }

            "pnpm"
            {
              pnpm ${{ inputs.build-command }}
            }

          }

      # Execute unit tests
      - name: Run Tests
        if: inputs.run-tests
        run: |

          switch ("${{ inputs.package-manager }}")
          {

            "npm"
            {
              npm run ${{ inputs.test-command }}
            }

            "yarn"
            {
              yarn ${{ inputs.test-command }}
            }

            "pnpm"
            {
              pnpm ${{ inputs.test-command }}
            }

          }

      # Validate artifact path
      - name: Validate Artifact
        run: |

          if(!(Test-Path "${{ inputs.artifact-path }}"))
          {
              throw "Artifact path not found."
          }

      # Upload artifact
      - name: Upload Artifact
        uses: ./.github/actions/awl-upload-artifact
        with:
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}

      # Publish workflow summary
      - name: Build Summary
        shell: pwsh
        run: |

          @"

          ## Node.js Build Summary

          | Item | Value |
          |------|-------|
          | Runner | Build |
          | Node | ${{ inputs.node-version }} |
          | Package Manager | ${{ inputs.package-manager }} |
          | Tests | ${{ inputs.run-tests }} |
          | Artifact | ${{ inputs.artifact-name }} |
          | Repository | ${{ github.repository }} |
          | Branch | ${{ github.ref_name }} |
          | Commit | ${{ github.sha }} |

          "@ >> $env:GITHUB_STEP_SUMMARY