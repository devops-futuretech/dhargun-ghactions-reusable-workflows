# ==========================================================================================
# Workflow : AWL - Build PHP
# Purpose  : Reusable workflow to build PHP applications (Laravel, Symfony, CodeIgniter)
# Runner   : Self-hosted Runner (build)
# Author   : AWL DevOps Team
# Version  : v1.0
# ==========================================================================================

name: AWL - Build PHP

on:

  workflow_call:

    inputs:

      working-directory:
        description: PHP project directory
        required: false
        default: "."
        type: string

      php-version:
        description: PHP Version
        required: false
        default: "8.3"
        type: string

      composer-options:
        description: Composer install options
        required: false
        default: "--no-dev --prefer-dist --optimize-autoloader"
        type: string

      run-tests:
        description: Execute unit tests
        required: false
        default: false
        type: boolean

      test-command:
        description: PHPUnit command
        required: false
        default: "vendor/bin/phpunit"
        type: string

      build-command:
        description: Optional custom build command
        required: false
        default: ""
        type: string

      artifact-name:
        description: Artifact Name
        required: true
        type: string

      artifact-path:
        description: Publish folder
        required: false
        default: "."
        type: string

      retention-days:
        description: Artifact retention
        required: false
        default: 30
        type: number

permissions:

  contents: read

jobs:

  build:

    name: Build PHP Application

    runs-on:

      - self-hosted
      - build

    defaults:

      run:

        shell: pwsh

        working-directory: ${{ inputs.working-directory }}

    outputs:

      artifact-name: ${{ inputs.artifact-name }}

      artifact-path: ${{ inputs.artifact-path }}

    steps:

      # Checkout repository
      - name: Checkout Source
        uses: actions/checkout@v5

      # Setup PHP Runtime
      - name: Setup PHP
        uses: ./.github/actions/awl-setup-php
        with:
          php-version: ${{ inputs.php-version }}

      # Install Composer dependencies
      - name: Install Dependencies
        run: |
          composer install ${{ inputs.composer-options }}

      # Execute unit tests
      - name: Run Tests
        if: inputs.run-tests
        run: |
          ${{ inputs.test-command }}

      # Execute custom build command
      - name: Custom Build
        if: inputs.build-command != ''
        run: |
          ${{ inputs.build-command }}

      # Optimize Composer autoloader
      - name: Optimize Autoloader
        run: |
          composer dump-autoload --optimize

      # Validate artifact path
      - name: Validate Artifact
        run: |

          if(!(Test-Path "${{ inputs.artifact-path }}"))
          {
              throw "Artifact path not found."
          }

      # Upload artifact
      - name: Upload Artifact
        uses: ./.github/actions/awl-upload-artifact
        with:
          artifact-name: ${{ inputs.artifact-name }}
          artifact-path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}

      # Publish workflow summary
      - name: Build Summary
        shell: pwsh
        run: |

          @"

          ## PHP Build Summary

          | Item | Value |
          |------|-------|
          | Runner | Build |
          | PHP | ${{ inputs.php-version }} |
          | Artifact | ${{ inputs.artifact-name }} |
          | Output | ${{ inputs.artifact-path }} |
          | Repository | ${{ github.repository }} |
          | Branch | ${{ github.ref_name }} |
          | Commit | ${{ github.sha }} |

          "@ >> $env:GITHUB_STEP_SUMMARY