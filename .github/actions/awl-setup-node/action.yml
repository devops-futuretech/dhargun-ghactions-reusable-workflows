name: AWL - Setup Node

description: >
  Composite action to install and configure Node.js runtime for
  reusable GitHub workflows.

author: AWL DevOps Team

inputs:

  node-version:
    description: Node.js version to install
    required: false
    default: "22"

  package-manager:
    description: npm | yarn | pnpm
    required: false
    default: "npm"

  enable-cache:
    description: Enable dependency cache
    required: false
    default: "true"

outputs:

  node-version:
    description: Installed Node.js version
    value: ${{ steps.node-version.outputs.node }}

runs:

  using: composite

  steps:

    # Checkout is intentionally NOT included.
    # Caller workflow must checkout repository.

    # Install requested Node.js version.
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.enable-cache == 'true' && inputs.package-manager || '' }}

    # Enable Corepack for Yarn/PNPM.
    - name: Enable Corepack
      if: inputs.package-manager == 'yarn' || inputs.package-manager == 'pnpm'
      shell: pwsh
      run: |
        corepack enable

    # Install PNPM.
    - name: Install PNPM
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: latest

    # Display installed versions.
    - name: Show Runtime Versions
      shell: pwsh
      run: |
        Write-Host "Node Version"
        node --version

        Write-Host ""
        Write-Host "Package Manager"

        if ("${{ inputs.package-manager }}" -eq "npm") {
          npm --version
        }

        if ("${{ inputs.package-manager }}" -eq "yarn") {
          yarn --version
        }

        if ("${{ inputs.package-manager }}" -eq "pnpm") {
          pnpm --version
        }

    # Export installed version.
    - name: Export Node Version
      id: node-version
      shell: pwsh
      run: |
        $version = node --version
        "node=$version" >> $env:GITHUB_OUTPUT