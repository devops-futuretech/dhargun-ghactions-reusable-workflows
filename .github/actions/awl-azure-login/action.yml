name: AWL - Azure Login

description: >
  Composite action to authenticate with Azure using
  OIDC or Service Principal.

author: AWL DevOps Team

inputs:

  client-id:
    description: Azure Client ID.
    required: true

  tenant-id:
    description: Azure Tenant ID.
    required: true

  subscription-id:
    description: Azure Subscription ID.
    required: true

  enable-cli:
    description: Verify Azure CLI after login.
    required: false
    default: "true"

outputs:

  subscription-id:
    description: Logged in subscription.
    value: ${{ inputs.subscription-id }}

runs:

  using: composite

  steps:

    # Login to Azure.
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    # Display Azure account.
    - name: Show Azure Context
      if: inputs.enable-cli == 'true'
      shell: pwsh
      run: |

        az account show

    # Verify current subscription.
    - name: Verify Subscription
      if: inputs.enable-cli == 'true'
      shell: pwsh
      run: |

        $subscription = az account show --query name -o tsv

        Write-Host "Current Subscription : $subscription"

    # Publish login summary.
    - name: Login Summary
      shell: pwsh
      run: |

        @"

        ## Azure Login

        | Item | Value |
        |------|-------|
        | Subscription | ${{ inputs.subscription-id }} |
        | Tenant | ${{ inputs.tenant-id }} |
        | Login | Successful |

        "@ >> $env:GITHUB_STEP_SUMMARY