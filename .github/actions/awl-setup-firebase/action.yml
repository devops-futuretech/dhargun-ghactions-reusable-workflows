# ==========================================================================================
# Action    : AWL - Setup Firebase
# Purpose   : Install Firebase CLI for reusable workflows
# Author    : AWL DevOps Team
# Version   : v1.0
# ==========================================================================================

name: AWL - Setup Firebase

description: >
  Composite action to install Node.js and Firebase CLI.

author: AWL DevOps Team

inputs:

  node-version:
    description: Node.js Version
    required: false
    default: "22"

  package-manager:
    description: npm | yarn | pnpm
    required: false
    default: npm

outputs:

  firebase-version:
    description: Installed Firebase CLI Version
    value: ${{ steps.version.outputs.version }}

runs:

  using: composite

  steps:

    # Setup Node runtime
    - name: Setup Node
      uses: ./.github/actions/awl-setup-node
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}

    # Install Firebase CLI
    - name: Install Firebase CLI
      shell: pwsh
      run: |
        npm install -g firebase-tools

    # Verify installation
    - name: Show Firebase Version
      id: version
      shell: pwsh
      run: |

        $version = firebase --version

        Write-Host "Firebase CLI : $version"

        "version=$version" >> $env:GITHUB_OUTPUT

    # Publish summary
    - name: Setup Summary
      shell: pwsh
      run: |

        @"

        ## Firebase Runtime

        | Item | Value |
        |------|-------|
        | Node | ${{ inputs.node-version }} |
        | Firebase CLI | Installed |

        "@ >> $env:GITHUB_STEP_SUMMARY