# ==========================================================================================
# Action    : AWL - Setup Python
# Purpose   : Install and configure Python runtime for reusable workflows
# Author    : AWL DevOps Team
# Version   : v1.0
# ==========================================================================================

name: AWL - Setup Python

description: >
  Composite action to install Python runtime and configure pip cache.

author: AWL DevOps Team

inputs:

  python-version:
    description: Python version to install
    required: false
    default: "3.12"

  cache:
    description: Enable pip cache
    required: false
    default: "pip"

outputs:

  python-version:
    description: Installed Python version
    value: ${{ steps.version.outputs.version }}

runs:

  using: composite

  steps:

    # Install requested Python version
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}

    # Upgrade pip
    - name: Upgrade pip
      shell: pwsh
      run: |
        python -m pip install --upgrade pip

    # Display Python runtime
    - name: Show Python Version
      shell: pwsh
      run: |
        python --version
        pip --version

    # Export installed version
    - name: Export Version
      id: version
      shell: pwsh
      run: |
        $version = python --version
        "version=$version" >> $env:GITHUB_OUTPUT

    # Publish setup summary
    - name: Setup Summary
      shell: pwsh
      run: |

        @"

        ## Python Runtime

        | Item | Value |
        |------|-------|
        | Python | ${{ inputs.python-version }} |
        | Cache | ${{ inputs.cache }} |

        "@ >> $env:GITHUB_STEP_SUMMARY