# ==========================================================================================
# Action    : AWL - Setup Flutter
# Purpose   : Install and configure Flutter SDK and Java
# Author    : AWL DevOps Team
# Version   : v1.1
# ==========================================================================================

name: AWL - Setup Flutter

description: >
  Composite action to install Flutter SDK and configure Android build environment.

author: AWL DevOps Team

inputs:

  flutter-version:
    description: Flutter SDK Version
    required: false
    default: "3.38.4"

  java-version:
    description: Java Version
    required: false
    default: "21"

  distribution:
    description: Java Distribution
    required: false
    default: "temurin"

  cache:
    description: Enable Flutter/Pub cache
    required: false
    default: "true"

outputs:

  flutter-version:
    description: Installed Flutter Version
    value: ${{ steps.version.outputs.version }}

runs:

  using: composite

  steps:

    # ======================================================================================
    # JAVA
    # ======================================================================================

    - name: Setup Java

      uses: actions/setup-java@v5

      with:

        distribution: ${{ inputs.distribution }}

        java-version: ${{ inputs.java-version }}

        cache: gradle

    # ======================================================================================
    # FLUTTER
    # ======================================================================================

    - name: Setup Flutter

      uses: subosito/flutter-action@v2

      with:

        flutter-version: ${{ inputs.flutter-version }}

        cache: ${{ inputs.cache }}

    # ======================================================================================
    # FLUTTER VERSION
    # ======================================================================================

    - name: Show Flutter Version

      shell: pwsh

      run: |

        flutter --version

    # ======================================================================================
    # FLUTTER DOCTOR
    # ======================================================================================

    - name: Flutter Doctor

      shell: pwsh

      run: |

        flutter doctor -v

    # ======================================================================================
    # EXPORT VERSION
    # ======================================================================================

    - name: Export Version

      id: version

      shell: pwsh

      run: |

        $version = flutter --version | Select-Object -First 1

        "version=$version" >> $env:GITHUB_OUTPUT

    # ======================================================================================
    # SUMMARY
    # ======================================================================================

    - name: Setup Summary

      shell: pwsh

      run: |

        @"

        ## Flutter Runtime

        | Item | Value |
        |------|-------|
        | Flutter | ${{ inputs.flutter-version }} |
        | Java | ${{ inputs.java-version }} |

        "@ >> $env:GITHUB_STEP_SUMMARY