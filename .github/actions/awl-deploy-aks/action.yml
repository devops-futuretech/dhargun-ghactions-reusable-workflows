# ==========================================================================================
# Action    : AWL - Deploy AKS
# Purpose   : Deploy application to Azure Kubernetes Service
# Author    : AWL DevOps Team
# Version   : v1.0
# ==========================================================================================

name: AWL - Deploy AKS

description: >
  Composite action to deploy applications to Azure Kubernetes Service.

author: AWL DevOps Team

inputs:

  resource-group:
    description: Azure Resource Group
    required: true

  aks-name:
    description: AKS Cluster Name
    required: true

  namespace:
    description: Kubernetes Namespace
    required: false
    default: default

  deployment-type:
    description: manifest | helm
    required: false
    default: manifest

  manifest-path:
    description: Kubernetes Manifest Folder
    required: false
    default: k8s

  helm-chart-path:
    description: Helm Chart Path
    required: false
    default: chart

  release-name:
    description: Helm Release Name
    required: false
    default: app

  values-file:
    description: Helm Values File
    required: false
    default: values.yaml

  image-name:
    description: Override Image Name
    required: false
    default: ""

  image-tag:
    description: Override Image Tag
    required: false
    default: ""

  wait-timeout:
    description: Rollout Timeout
    required: false
    default: 300s

outputs:

  deployment-status:
    description: Deployment Status
    value: ${{ steps.rollout.outputs.status }}

runs:

  using: composite

  steps:

    # Get AKS Credentials
    - name: Get AKS Credentials
      shell: pwsh
      run: |

        az aks get-credentials `
          --resource-group "${{ inputs.resource-group }}" `
          --name "${{ inputs.aks-name }}" `
          --overwrite-existing

    # Validate Cluster
    - name: Validate Cluster
      shell: bash
      run: |

        kubectl cluster-info

        kubectl get nodes

    # Create Namespace
    - name: Create Namespace
      shell: bash
      run: |

        kubectl get namespace "${{ inputs.namespace }}" \
        || kubectl create namespace "${{ inputs.namespace }}"
        # Deploy Kubernetes Manifests
    - name: Deploy Kubernetes Manifests
      if: inputs.deployment-type == 'manifest'
      shell: bash
      run: |

        kubectl apply \
          -n "${{ inputs.namespace }}" \
          -f "${{ inputs.manifest-path }}"

    # Helm Upgrade / Install
    - name: Deploy Helm Chart
      if: inputs.deployment-type == 'helm'
      shell: bash
      run: |

        helm upgrade \
          --install \
          "${{ inputs.release-name }}" \
          "${{ inputs.helm-chart-path }}" \
          --namespace "${{ inputs.namespace }}" \
          --values "${{ inputs.values-file }}"

    # Override Container Image
    - name: Update Deployment Image
      if: inputs.image-name != '' && inputs.image-tag != ''
      shell: bash
      run: |

        kubectl set image deployment/${{ inputs.release-name }} \
          *=${{ inputs.image-name }}:${{ inputs.image-tag }} \
          -n "${{ inputs.namespace }}"

    # Wait for Rollout
    - name: Wait for Rollout
      id: rollout
      shell: bash
      run: |

        kubectl rollout status \
          deployment/${{ inputs.release-name }} \
          -n "${{ inputs.namespace }}" \
          --timeout=${{ inputs.wait-timeout }}

        echo "status=Success" >> "$GITHUB_OUTPUT"

    # Display Kubernetes Resources
    - name: Deployment Information
      shell: bash
      run: |

        kubectl get pods \
          -n "${{ inputs.namespace }}" \
          -o wide

        kubectl get svc \
          -n "${{ inputs.namespace }}"

        kubectl get ingress \
          -n "${{ inputs.namespace }}" || true

    # Verify Deployment
    - name: Verify Deployment
      shell: bash
      run: |

        kubectl describe deployment \
          "${{ inputs.release-name }}" \
          -n "${{ inputs.namespace }}"

    # Deployment Summary
    - name: Deployment Summary
      shell: bash
      run: |

        cat <<EOF >> "$GITHUB_STEP_SUMMARY"

        ## AKS Deployment

        | Item | Value |
        |------|-------|
        | Cluster | ${{ inputs.aks-name }} |
        | Namespace | ${{ inputs.namespace }} |
        | Deployment Type | ${{ inputs.deployment-type }} |
        | Release | ${{ inputs.release-name }} |
        | Image | ${{ inputs.image-name }}:${{ inputs.image-tag }} |
        | Status | Success |

        EOF