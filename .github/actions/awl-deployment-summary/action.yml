# ==========================================================================================
# Action    : AWL - Deployment Summary
# Purpose   : Publish deployment summary to GitHub Step Summary
# Author    : AWL DevOps Team
# Version   : v1.0
# ==========================================================================================

name: AWL - Deployment Summary

description: >
  Composite action to publish deployment summary.

author: AWL DevOps Team

inputs:

  application-name:
    description: Application Name
    required: true

  environment:
    description: Deployment Environment
    required: true

  deployment-type:
    description: Deployment Type
    required: true

  version:
    description: Application Version
    required: false
    default: "N/A"

  artifact-name:
    description: Artifact Name
    required: false
    default: "N/A"

  runner-name:
    description: Runner Name
    required: false
    default: "${{ runner.name }}"

  deployment-status:
    description: Deployment Status
    required: true

  deployment-duration:
    description: Deployment Duration
    required: false
    default: "N/A"

  deployment-url:
    description: Application URL
    required: false
    default: ""

runs:

  using: composite

  steps:

    # Publish GitHub Summary
    - name: Publish Deployment Summary
      shell: bash
      run: |

        cat <<EOF >> "$GITHUB_STEP_SUMMARY"

        # 🚀 Deployment Summary

        | Property | Value |
        |----------|-------|
        | Application | ${{ inputs.application-name }} |
        | Environment | ${{ inputs.environment }} |
        | Deployment Type | ${{ inputs.deployment-type }} |
        | Version | ${{ inputs.version }} |
        | Artifact | ${{ inputs.artifact-name }} |
        | Runner | ${{ inputs.runner-name }} |
        | Duration | ${{ inputs.deployment-duration }} |
        | Status | ${{ inputs.deployment-status }} |
        | URL | ${{ inputs.deployment-url }} |

        ---
        Generated by **AWL GitHub Enterprise Accelerator**

        EOF